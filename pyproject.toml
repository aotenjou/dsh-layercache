[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layercache-client"
version = "0.1.0"
description = "Python client for the LayerCache stateful LayerFS tool cache"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src/python"]
